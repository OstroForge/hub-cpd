services:
  - type: web
    name: hub-cpd
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python serve.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: PUBLIC_URL
        value: https://hub-cpd.onrender.com
      - key: HOST_TOKEN
        generateValue: true
      - key: FEEDBACK_SHARE_URL
        sync: false
  - type: web
    name: copd-cpd
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python serve.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
